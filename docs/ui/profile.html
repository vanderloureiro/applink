<style type="text/tailwindcss">

            --primary-green: #17cf17;
            --light-gray: #f5f5f5;
            --medium-gray: #e5e7eb;
            --dark-gray: #6b7280;
            --text-color: #1f2937;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-gray);
            color: var(--text-color);
        }
        .btn-primary {
            @apply bg-[var(--primary-green)] text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-opacity-90 transition-all duration-300;
        }
        .input-field {
            @apply w-full bg-white border border-[var(--medium-gray)] rounded-lg px-4 py-3 focus:ring-2 focus:ring-[var(--primary-green)] focus:border-transparent transition-colors duration-300;
        }
        .card {
            @apply bg-white rounded-xl shadow-sm p-6;
        }
        .btn-secondary {
            @apply bg-white border border-[var(--medium-gray)] text-[var(--dark-gray)] font-semibold py-2 px-4 rounded-lg hover:bg-gray-50 transition-all duration-300;
        }
    </style>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<div class="md:col-span-1">
<div class="card p-6 text-center">
<div class="relative w-32 h-32 mx-auto mb-4">

<h2 class="text-xl font-bold">Alex Johnson</h2>
<p class="text-[var(--dark-gray)]">alex.johnson@example.com</p>
</div>

<div class="md:col-span-2">
<div class="card p-8">
<h3 class="text-xl font-bold mb-6">Personal Information</h3>
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="name">Full Name</label>
<input class="input-field" id="name" name="name" type="text" value="Alex Johnson"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
<input class="input-field" id="email" name="email" type="email" value="alex.johnson@example.com"/>
</div>
<div class="pt-4 flex justify-end gap-3">
<button class="btn-secondary" type="button">Cancel</button>
<button class="btn-primary" type="submit">Save Changes</button>
</div>
</form>
</div>
<div class="card p-8 mt-8">
<h3 class="text-xl font-bold mb-6">Change Password</h3>
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="current-password">Current Password</label>
<input class="input-field" id="current-password" name="current-password" type="password"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="new-password">New Password</label>
<input class="input-field" id="new-password" name="new-password" type="password"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="confirm-password">Confirm New Password</label>
<input class="input-field" id="confirm-password" name="confirm-password" type="password"/>
</div>
<div class="pt-4 flex justify-end gap-3">
<button class="btn-primary" type="submit">Update Password</button>
</div>
</form>
</div>
</div>
</div>

<div class="container mx-auto px-6 text-center text-sm text-[var(--dark-gray)]">
